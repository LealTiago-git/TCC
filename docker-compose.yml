# Base comum dos papeis Python (server/proxy/agent/dashboard): 1 imagem, 1 config.
x-app: &app
  build: .
  image: tcc-defense:latest
  # ponytail: bind-mount compartilha access_control.db + codigo vivo entre os papeis.
  # Teto: lock do SQLite sobre bind-mount Windows pode travar sob concorrencia alta.
  # Upgrade: volume nomeado em /app/data, ou mover control-plane p/ Postgres.
  volumes:
    - ./:/app
  environment:
    POSTGRES_DSN: host=postgres port=5432 dbname=tcc_target user=app password=app_pwd
    MONGO_URI: mongodb://app:app_pwd@mongo:27017/?authSource=admin
    AGENT_PROVIDER: ollama
    OLLAMA_NATIVE_URL: http://host.docker.internal:11434
    OLLAMA_API_KEY: ollama
  extra_hosts:
    - "host.docker.internal:host-gateway"  # Ollama roda no HOST (GPU), nao em container
  depends_on:
    - postgres
    - mongo

services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcc_target
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pwd
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: tcc_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tcc_target
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app_pwd
    ports:
      - "27017:27017"
    volumes:
      - ./scripts/init_mongo.js:/docker-entrypoint-initdb.d/init.js:ro
      - mongo_data:/data/db

  # --- Lab OWASP oficial (alvo padronizado p/ estudos de caso) ---
  # Efêmero de propósito: reseta a cada "up" => runs reproduzíveis p/ métrica.
  # Ataques passam pelo proxy.py (porta 9000) p/ entrar em access_logs.
  # crAPI roda no compose oficial dele (colide PG/Mongo); proxy aponta p/ ele.
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: tcc_juice_shop
    restart: unless-stopped
    ports:
      - "3000:3000" # http://localhost:3000  (scoreboard embutido = métricas de desafio)

  # --- Papeis Python do lab (mesma imagem tcc-defense) ---
  server:
    <<: *app
    container_name: tcc_server
    command: python -m access_defense.server --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  proxy:
    <<: *app
    container_name: tcc_proxy
    command: python -m access_defense.proxy --host 0.0.0.0 --port 9000 --upstream http://juice-shop:3000 --name juice-shop
    ports:
      - "9000:9000"
    depends_on:
      - postgres
      - mongo
      - juice-shop

  agent:
    <<: *app
    container_name: tcc_agent
    command: python -m access_defense.agent_loop --model qwen2.5 --interval 3

  dashboard:
    <<: *app
    container_name: tcc_dashboard
    command: python -m streamlit run access_defense/dashboard.py --server.headless true --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"

volumes:
  pg_data:
  mongo_data:
