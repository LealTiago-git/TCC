services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcc_target
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pwd
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: tcc_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tcc_target
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app_pwd
    ports:
      - "27017:27017"
    volumes:
      - ./scripts/init_mongo.js:/docker-entrypoint-initdb.d/init.js:ro
      - mongo_data:/data/db

  # --- Lab OWASP oficial (alvo padronizado p/ estudos de caso) ---
  # Efêmero de propósito: reseta a cada "up" => runs reproduzíveis p/ métrica.
  # Ataques passam pelo proxy.py (porta 9000) p/ entrar em access_logs.
  # crAPI roda no compose oficial dele (colide PG/Mongo); proxy aponta p/ ele.
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: tcc_juice_shop
    restart: unless-stopped
    ports:
      - "3000:3000" # http://localhost:3000  (scoreboard embutido = métricas de desafio)

volumes:
  pg_data:
  mongo_data:
